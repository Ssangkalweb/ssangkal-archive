<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 88" role="img" aria-labelledby="title desc">
  <title id="title">쌍칼 아카이브 정밀 SK 방패 마크</title>
  <desc id="desc">정확한 중심축과 45도 각도로 설계한 아이보리 S와 붉은 K 모노그램</desc>
  <defs>
    <linearGradient id="body" x1="13" y1="9" x2="67" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182637"/>
      <stop offset=".52" stop-color="#0b141f"/>
      <stop offset="1" stop-color="#060b12"/>
    </linearGradient>
    <linearGradient id="edge" x1="10" y1="12" x2="70" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5efe2"/>
      <stop offset=".45" stop-color="#d9ba6c"/>
      <stop offset="1" stop-color="#8da8b5"/>
    </linearGradient>
  </defs>

  <!-- 80 × 88 정밀 그리드 / 중심축 x=40 / 좌우 완전 대칭 -->
  <path d="M40 1.5 76 14v34.5L67 70 40 87 13 70 4 48.5V14L40 1.5Z" fill="#04080e"/>
  <path d="M40 5.5 72 16.6v31.1L63.7 67 40 81.9 16.3 67 8 47.7V16.6L40 5.5Z" fill="url(#body)" stroke="url(#edge)" stroke-width="2.2" stroke-linejoin="miter"/>
  <path d="M40 10.4 67.5 19.9v26.9l-7.3 16.9L40 76.4 19.8 63.7l-7.3-16.9V19.9L40 10.4Z" fill="none" stroke="#8ea5b1" stroke-opacity=".46" stroke-width="1.2" stroke-linejoin="miter"/>

  <!-- 글자 상·하단 y=23/59 / 기본 획 6 / K 대각선 45° -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="bevel">
    <path d="M38 23H21l-4 4v9l4 4h13l4 4v11l-4 4H17" stroke="#050910" stroke-width="10"/>
    <path d="M43 23v36M61 23 43 41l18 18" stroke="#050910" stroke-width="10"/>
    <path d="M38 23H21l-4 4v9l4 4h13l4 4v11l-4 4H17" stroke="#f4efe4" stroke-width="6"/>
    <path d="M43 23v36M61 23 43 41l18 18" stroke="#ef4e46" stroke-width="6"/>
  </g>

  <!-- 중심축과 하단 서명 포인트 -->
  <path d="M40 8.2v5.4" stroke="#d9ba6c" stroke-width="1.6"/>
  <path d="m40 79.4 3.2-2-3.2 5-3.2-5 3.2 2Z" fill="#ef4e46"/>
  <path d="M66.2 17.7 72 19.7v6.4l-2.5-.9v-3.7l-3.3-1.1v-2.7Z" fill="#ef4e46"/>
</svg>
